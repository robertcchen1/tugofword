<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Minimalist sitting black cat silhouette -->
  <!-- Tail curling up around the body -->
  <path d="M 48 50 Q 58 44 56 30 Q 53 22 47 26"
        fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />
  <!-- Body: smooth pear shape -->
  <path d="M 16 56 Q 12 40 18 28 Q 26 18 38 18 Q 50 18 52 32 Q 54 48 50 56 Z"
        fill="#1a1a1a" />
  <!-- White chest tuft -->
  <path d="M 28 42 Q 34 36 40 42 Q 38 52 34 53 Q 30 52 28 42 Z"
        fill="#f4ede0" />
  <!-- Ears -->
  <path d="M 16 24 L 12 8 L 26 18 Z" fill="#1a1a1a" />
  <path d="M 48 24 L 52 8 L 38 18 Z" fill="#1a1a1a" />
  <!-- Inner ear pink -->
  <path d="M 18 22 L 16 14 L 23 19 Z" fill="#ff9aa2" opacity="0.7" />
  <path d="M 46 22 L 48 14 L 41 19 Z" fill="#ff9aa2" opacity="0.7" />
  <!-- Green eyes -->
  <ellipse cx="24" cy="28" rx="2.5" ry="3.5" fill="#6fbf5b" />
  <ellipse cx="40" cy="28" rx="2.5" ry="3.5" fill="#6fbf5b" />
  <!-- Black slit pupils -->
  <ellipse cx="24" cy="29" rx="0.9" ry="2.5" fill="#0a0a0a" />
  <ellipse cx="40" cy="29" rx="0.9" ry="2.5" fill="#0a0a0a" />
</svg>
