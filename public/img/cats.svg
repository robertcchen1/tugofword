<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- ===========================================================
       Cat sprite sheet — polished vector illustrations.

       Solid fills (no url(#grad) refs) so the symbols render reliably
       when <use>'d from the arena SVG in index.html. Subtle shading
       comes from overlay paths with low opacity rather than gradients.

       Both cats use a 120×160 viewBox so all existing JS positioning
       maths in app.js works unchanged. Built once facing right; the
       orange cat is mirrored via outer scale(-1, 1).
       =========================================================== -->

  <!-- ============================================================
       BLACK CAT — facing right, paws on rope
       ============================================================ -->
  <symbol id="cat-black" viewBox="0 0 120 160">
    <!-- Tail curling up behind the body -->
    <path d="M 28 110 Q 6 100 6 70 Q 8 42 26 38 Q 32 42 30 50 Q 18 55 16 72 Q 17 90 32 100 Z"
          fill="#1a1a1a" />
    <!-- Back left leg / hip -->
    <path d="M 38 138 Q 33 152 40 156 Q 50 156 50 144 Q 48 134 42 132 Z" fill="#1a1a1a" />
    <!-- Back right leg / hip -->
    <path d="M 70 138 Q 75 152 82 154 Q 92 152 90 142 Q 86 132 78 132 Z" fill="#1a1a1a" />
    <!-- White socks on back paws -->
    <ellipse cx="42" cy="153" rx="7" ry="4" fill="#fffaf0" />
    <ellipse cx="84" cy="151" rx="7" ry="4" fill="#fffaf0" />
    <!-- Main body: rounded pear shape -->
    <path d="M 30 110 Q 22 80 38 62 Q 60 50 82 62 Q 96 80 92 110 Q 92 142 60 144 Q 28 142 30 110 Z"
          fill="#1a1a1a" />
    <!-- Subtle highlight on upper-right of body (a lighter charcoal overlay) -->
    <path d="M 60 56 Q 80 60 88 78 Q 88 96 78 100 Q 70 90 64 80 Q 62 68 60 56 Z"
          fill="#3a3530" opacity="0.7" />
    <!-- White chest + belly tuft (irregular cloud shape) -->
    <path d="M 45 90 Q 52 82 60 84 Q 68 82 75 90 Q 78 110 74 128 Q 60 140 46 128 Q 42 110 45 90 Z"
          fill="#fffaf0" />
    <!-- Subtle warm cream tint on the chest tuft for depth -->
    <path d="M 50 100 Q 60 96 70 100 Q 72 122 70 126 Q 60 132 50 126 Q 48 122 50 100 Z"
          fill="#f0e5c8" opacity="0.5" />
    <!-- Front paws gripping rope (right side of body) -->
    <path d="M 88 96 Q 100 92 104 100 Q 104 110 96 112 Q 88 110 86 102 Z"
          fill="#1a1a1a" transform="rotate(-18 95 102)" />
    <path d="M 90 110 Q 102 108 106 116 Q 105 124 96 126 Q 88 124 88 116 Z"
          fill="#1a1a1a" transform="rotate(-8 96 118)" />
    <!-- White paw tips -->
    <ellipse cx="100" cy="108" rx="5" ry="3.5" fill="#fffaf0" transform="rotate(-18 100 108)" />
    <ellipse cx="102" cy="122" rx="5" ry="3.5" fill="#fffaf0" transform="rotate(-8 102 122)" />
    <!-- Subtle body shading lines for fur texture -->
    <path d="M 32 90 Q 35 110 36 130" stroke="#000" stroke-width="0.6" fill="none" opacity="0.3" />
    <path d="M 26 75 Q 29 95 30 115" stroke="#000" stroke-width="0.5" fill="none" opacity="0.25" />
    <!-- Head: large round with subtle cheek puff -->
    <path d="M 26 56 Q 24 36 36 26 Q 50 18 60 18 Q 72 18 84 26 Q 92 38 90 56 Q 90 76 76 84 Q 60 90 44 84 Q 28 76 26 56 Z"
          fill="#1a1a1a" />
    <!-- Lighter shading on top-right of head -->
    <path d="M 60 20 Q 76 24 86 38 Q 88 50 84 56 Q 76 52 70 42 Q 64 30 60 20 Z"
          fill="#3a3530" opacity="0.65" />
    <!-- Ears (triangular outer) -->
    <path d="M 30 32 L 22 6 Q 28 12 42 24 Z" fill="#1a1a1a" />
    <path d="M 86 32 L 94 6 Q 88 12 74 24 Z" fill="#1a1a1a" />
    <!-- Tiny fur tufts at ear tips -->
    <path d="M 23 8 L 25 4 L 27 9 Z" fill="#3a3530" />
    <path d="M 93 8 L 91 4 L 89 9 Z" fill="#3a3530" />
    <!-- Inner ear pink -->
    <path d="M 32 28 L 28 14 Q 33 19 40 24 Z" fill="#ff9aa2" opacity="0.85" />
    <path d="M 84 28 L 88 14 Q 83 19 76 24 Z" fill="#ff9aa2" opacity="0.85" />
    <!-- Eyes: vivid green almond shape -->
    <ellipse cx="44" cy="52" rx="6.5" ry="8" fill="#6fbf5b" />
    <ellipse cx="72" cy="52" rx="6.5" ry="8" fill="#6fbf5b" />
    <!-- Eye highlight rim (lighter green inner) -->
    <ellipse cx="44" cy="50" rx="4" ry="5.5" fill="#a8e070" opacity="0.6" />
    <ellipse cx="72" cy="50" rx="4" ry="5.5" fill="#a8e070" opacity="0.6" />
    <!-- Vertical-slit pupils -->
    <ellipse cx="44" cy="53" rx="1.6" ry="6" fill="#0a0a0a" />
    <ellipse cx="72" cy="53" rx="1.6" ry="6" fill="#0a0a0a" />
    <!-- White highlight dots in eyes -->
    <circle cx="46.5" cy="48" r="1.4" fill="#ffffff" />
    <circle cx="74.5" cy="48" r="1.4" fill="#ffffff" />
    <!-- Subtle eye outline strokes -->
    <path d="M 38 50 Q 44 44 50 50" stroke="#0a0a0a" stroke-width="0.7" fill="none" opacity="0.6" />
    <path d="M 66 50 Q 72 44 78 50" stroke="#0a0a0a" stroke-width="0.7" fill="none" opacity="0.6" />
    <!-- Nose: small pink triangle -->
    <path d="M 54 64 Q 58 62 62 64 L 58 70 Z" fill="#ff9aa2" />
    <!-- Mouth -->
    <path d="M 58 70 L 58 73" stroke="#0a0a0a" stroke-width="0.8" />
    <path d="M 58 73 Q 54 76 50 74" stroke="#0a0a0a" stroke-width="0.9" fill="none" stroke-linecap="round" />
    <path d="M 58 73 Q 62 76 66 74" stroke="#0a0a0a" stroke-width="0.9" fill="none" stroke-linecap="round" />
    <!-- Whiskers -->
    <path d="M 38 66 Q 28 65 18 62" stroke="#aaa" stroke-width="0.6" fill="none" />
    <path d="M 38 69 Q 28 70 16 70" stroke="#aaa" stroke-width="0.6" fill="none" />
    <path d="M 38 72 Q 28 74 18 78" stroke="#aaa" stroke-width="0.6" fill="none" />
    <path d="M 78 66 Q 88 65 98 62" stroke="#aaa" stroke-width="0.6" fill="none" />
    <path d="M 78 69 Q 88 70 100 70" stroke="#aaa" stroke-width="0.6" fill="none" />
    <path d="M 78 72 Q 88 74 98 78" stroke="#aaa" stroke-width="0.6" fill="none" />
  </symbol>

  <!-- ============================================================
       ORANGE TABBY CAT — facing left (mirrored)
       ============================================================ -->
  <symbol id="cat-orange" viewBox="0 0 120 160">
    <g transform="translate(120 0) scale(-1 1)">
      <!-- Tail -->
      <path d="M 28 110 Q 6 100 6 70 Q 8 42 26 38 Q 32 42 30 50 Q 18 55 16 72 Q 17 90 32 100 Z"
            fill="#d96c2c" />
      <!-- Tail stripes -->
      <path d="M 14 64 Q 18 62 22 66" stroke="#8a3f0e" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="round" />
      <path d="M 12 76 Q 16 74 20 78" stroke="#8a3f0e" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="round" />
      <path d="M 14 88 Q 18 86 22 90" stroke="#8a3f0e" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="round" />
      <!-- Back legs / hips -->
      <path d="M 38 138 Q 33 152 40 156 Q 50 156 50 144 Q 48 134 42 132 Z" fill="#d96c2c" />
      <path d="M 70 138 Q 75 152 82 154 Q 92 152 90 142 Q 86 132 78 132 Z" fill="#d96c2c" />
      <!-- White socks on back paws -->
      <ellipse cx="42" cy="153" rx="7" ry="4" fill="#fffaf0" />
      <ellipse cx="84" cy="151" rx="7" ry="4" fill="#fffaf0" />
      <!-- Main body -->
      <path d="M 30 110 Q 22 80 38 62 Q 60 50 82 62 Q 96 80 92 110 Q 92 142 60 144 Q 28 142 30 110 Z"
            fill="#d96c2c" />
      <!-- Lighter highlight on upper-right of body -->
      <path d="M 60 56 Q 80 60 88 78 Q 88 96 78 100 Q 70 90 64 80 Q 62 68 60 56 Z"
            fill="#f08a3a" opacity="0.55" />
      <!-- Tabby stripes on body (curved paths) -->
      <path d="M 36 80 Q 42 75 48 80" stroke="#8a3f0e" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
      <path d="M 32 96 Q 42 90 52 96" stroke="#8a3f0e" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
      <path d="M 30 112 Q 42 106 54 112" stroke="#8a3f0e" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round" />
      <path d="M 30 128 Q 42 122 54 128" stroke="#8a3f0e" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round" />
      <path d="M 70 80 Q 76 75 82 80" stroke="#8a3f0e" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
      <path d="M 68 96 Q 78 90 86 96" stroke="#8a3f0e" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" />
      <!-- White chest + belly tuft -->
      <path d="M 45 92 Q 52 84 60 86 Q 68 84 75 92 Q 78 112 74 130 Q 60 142 46 130 Q 42 112 45 92 Z"
            fill="#fffaf0" />
      <!-- Front paws gripping rope -->
      <path d="M 88 96 Q 100 92 104 100 Q 104 110 96 112 Q 88 110 86 102 Z"
            fill="#d96c2c" transform="rotate(-18 95 102)" />
      <path d="M 90 110 Q 102 108 106 116 Q 105 124 96 126 Q 88 124 88 116 Z"
            fill="#d96c2c" transform="rotate(-8 96 118)" />
      <!-- White paw tips -->
      <ellipse cx="100" cy="108" rx="5" ry="3.5" fill="#fffaf0" transform="rotate(-18 100 108)" />
      <ellipse cx="102" cy="122" rx="5" ry="3.5" fill="#fffaf0" transform="rotate(-8 102 122)" />
      <!-- Head -->
      <path d="M 26 56 Q 24 36 36 26 Q 50 18 60 18 Q 72 18 84 26 Q 92 38 90 56 Q 90 76 76 84 Q 60 90 44 84 Q 28 76 26 56 Z"
            fill="#d96c2c" />
      <!-- Lighter highlight on top-right of head -->
      <path d="M 60 20 Q 76 24 86 38 Q 88 50 84 56 Q 76 52 70 42 Q 64 30 60 20 Z"
            fill="#f08a3a" opacity="0.55" />
      <!-- Forehead M-stripe -->
      <path d="M 44 30 Q 48 38 52 30" stroke="#8a3f0e" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />
      <path d="M 54 30 Q 58 38 62 30" stroke="#8a3f0e" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />
      <path d="M 64 30 Q 68 38 72 30" stroke="#8a3f0e" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round" />
      <!-- Cheek stripes -->
      <path d="M 32 56 Q 38 58 40 60" stroke="#8a3f0e" stroke-width="1.6" fill="none" opacity="0.55" />
      <path d="M 32 64 Q 38 64 40 66" stroke="#8a3f0e" stroke-width="1.6" fill="none" opacity="0.55" />
      <path d="M 88 56 Q 82 58 80 60" stroke="#8a3f0e" stroke-width="1.6" fill="none" opacity="0.55" />
      <path d="M 88 64 Q 82 64 80 66" stroke="#8a3f0e" stroke-width="1.6" fill="none" opacity="0.55" />
      <!-- Ears -->
      <path d="M 30 32 L 22 6 Q 28 12 42 24 Z" fill="#d96c2c" />
      <path d="M 86 32 L 94 6 Q 88 12 74 24 Z" fill="#d96c2c" />
      <!-- Inner ear pink -->
      <path d="M 32 28 L 28 14 Q 33 19 40 24 Z" fill="#ff9aa2" />
      <path d="M 84 28 L 88 14 Q 83 19 76 24 Z" fill="#ff9aa2" />
      <!-- Eyes -->
      <ellipse cx="44" cy="52" rx="6.5" ry="8" fill="#6fbf5b" />
      <ellipse cx="72" cy="52" rx="6.5" ry="8" fill="#6fbf5b" />
      <ellipse cx="44" cy="50" rx="4" ry="5.5" fill="#a8e070" opacity="0.6" />
      <ellipse cx="72" cy="50" rx="4" ry="5.5" fill="#a8e070" opacity="0.6" />
      <ellipse cx="44" cy="53" rx="1.6" ry="6" fill="#0a0a0a" />
      <ellipse cx="72" cy="53" rx="1.6" ry="6" fill="#0a0a0a" />
      <circle cx="46.5" cy="48" r="1.4" fill="#ffffff" />
      <circle cx="74.5" cy="48" r="1.4" fill="#ffffff" />
      <path d="M 38 50 Q 44 44 50 50" stroke="#5a2a05" stroke-width="0.7" fill="none" opacity="0.6" />
      <path d="M 66 50 Q 72 44 78 50" stroke="#5a2a05" stroke-width="0.7" fill="none" opacity="0.6" />
      <!-- Nose -->
      <path d="M 54 64 Q 58 62 62 64 L 58 70 Z" fill="#ff9aa2" />
      <!-- Mouth -->
      <path d="M 58 70 L 58 73" stroke="#5a2a05" stroke-width="0.8" />
      <path d="M 58 73 Q 54 76 50 74" stroke="#5a2a05" stroke-width="0.9" fill="none" stroke-linecap="round" />
      <path d="M 58 73 Q 62 76 66 74" stroke="#5a2a05" stroke-width="0.9" fill="none" stroke-linecap="round" />
      <!-- Whiskers (white on orange) -->
      <path d="M 38 66 Q 28 65 18 62" stroke="#fff" stroke-width="0.7" fill="none" opacity="0.85" />
      <path d="M 38 69 Q 28 70 16 70" stroke="#fff" stroke-width="0.7" fill="none" opacity="0.85" />
      <path d="M 38 72 Q 28 74 18 78" stroke="#fff" stroke-width="0.7" fill="none" opacity="0.85" />
      <path d="M 78 66 Q 88 65 98 62" stroke="#fff" stroke-width="0.7" fill="none" opacity="0.85" />
      <path d="M 78 69 Q 88 70 100 70" stroke="#fff" stroke-width="0.7" fill="none" opacity="0.85" />
      <path d="M 78 72 Q 88 74 98 78" stroke="#fff" stroke-width="0.7" fill="none" opacity="0.85" />
    </g>
  </symbol>
</svg>
